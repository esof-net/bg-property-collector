name: Publish site data

# Copies the two Home data files the scrapers commit on main (data/home_stats.json, data/area_index.json) to the
# gh-pages branch and then deploys, without rebuilding the frontend. NOT a scraper: it changes nothing on main and
# never runs build_home_stats.py (the scrape workflows already do, before their commit).
#
# WHEN
#   - after a SUCCESSFUL "Scrape property listings" / "Scrape large property listing sites" run on main; and
#   - by hand (workflow_dispatch). A manual run skips the "regenerated by this scrape" check, so it can initialise
#     gh-pages/data/ before the first frontend deploy, or re-sync after an outage.
#
# RULES (scripts/validate_site_data.py, exit codes 0 ok / 1 invalid / 3 older than published / 4 not regenerated)
#   - Both files are validated independently; freshness uses home_stats.json generatedAt only (area_index.json has none).
#   - Both files are copied from the SAME main commit (checked out at run time, not the event SHA) in ONE gh-pages commit.
#   - Invalid data fails the run and leaves the published files alone. Data older than what is published, or (scrape
#     runs only) not regenerated by the triggering scrape (build_home_stats is continue-on-error there), is skipped
#     with a warning.
#   - The push retries up to 5 times. Before every rebase the data is compared again with the freshly fetched
#     gh-pages, so a newer published copy can never be overwritten by a slow older run.
#   - GITHUB_TOKEN pushes start no workflows, so the deploy job below calls deploy-site.yml directly.
# Until PUBLIC_SITE_LIVE is 'true' the deploy job is skipped and a missing gh-pages is only a warning.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Scrape property listings", "Scrape large property listing sites"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-site-data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.copy.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the statistics on main
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCRAPE_RUN_STARTED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -uo pipefail
          cd main
          args=(data)
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            args+=(--generated-after "$SCRAPE_RUN_STARTED")
          fi
          python scripts/validate_site_data.py "${args[@]}"
          rc=$?
          case "$rc" in
            0|4) ;;
            *) echo "::error::data/home_stats.json or data/area_index.json on main is invalid (details above); gh-pages is left untouched."
               exit 1 ;;
          esac
          python -m unittest tests.test_validate_site_data || { echo "::error::the validator's own tests failed"; exit 1; }
          if [ "$rc" = "4" ]; then
            echo "::warning::The triggering scrape did not regenerate data/home_stats.json (build_home_stats.py is continue-on-error); not publishing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Does gh-pages exist?
        id: branch
        if: steps.validate.outputs.skip == 'false'
        env:
          SITE_LIVE: ${{ vars.PUBLIC_SITE_LIVE }}
        run: |
          set -uo pipefail
          if git -C main ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$SITE_LIVE" = "true" ]; then
            echo "::error::PUBLIC_SITE_LIVE is true but the gh-pages branch does not exist"
            exit 1
          else
            echo "::warning::gh-pages does not exist yet (pre-cutover); nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.branch.outputs.found == 'true'
        with:
          ref: gh-pages
          path: site

      - name: Copy both files to gh-pages and push
        id: copy
        if: steps.branch.outputs.found == 'true'
        run: |
          set -uo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          src=main/data
          mkdir -p site/data

          python main/scripts/validate_site_data.py "$src" --not-older-than site/data
          rc=$?
          if [ "$rc" = "3" ]; then
            echo "::warning::gh-pages already holds newer statistics; leaving them alone."
            exit 0
          elif [ "$rc" != "0" ]; then
            exit 1
          fi
          if cmp -s "$src/home_stats.json" site/data/home_stats.json && cmp -s "$src/area_index.json" site/data/area_index.json; then
            echo "gh-pages already has these files; nothing to publish."
            exit 0
          fi

          main_sha="$(git -C main rev-parse --short HEAD)"
          generated="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["generatedAt"])' "$src/home_stats.json")"
          cp "$src/home_stats.json" "$src/area_index.json" site/data/
          cd site
          git config user.name "property-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/home_stats.json data/area_index.json
          git commit -q -m "Refresh site data from main@${main_sha} (generatedAt ${generated})"

          mkdir -p ../upstream
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 5); fetching the latest gh-pages."
            sleep $((attempt * 5))
            git fetch -q origin gh-pages
            # Freshness is re-checked on EVERY retry, against what is published right now.
            git show origin/gh-pages:data/home_stats.json > ../upstream/home_stats.json 2>/dev/null || rm -f ../upstream/home_stats.json
            python ../main/scripts/validate_site_data.py "../$src" --not-older-than ../upstream
            rc=$?
            if [ "$rc" = "3" ]; then
              echo "::warning::A newer data refresh landed on gh-pages meanwhile; dropping this older one."
              git reset -q --hard origin/gh-pages
              exit 0
            elif [ "$rc" != "0" ]; then
              exit 1
            fi
            if ! git rebase origin/gh-pages; then
              git rebase --abort || true
              echo "::error::Rebase onto gh-pages failed"
              exit 1
            fi
          done
          echo "::error::Could not push to gh-pages after 5 attempts"
          exit 1

  deploy:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' && vars.PUBLIC_SITE_LIVE == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      verify_only: false
